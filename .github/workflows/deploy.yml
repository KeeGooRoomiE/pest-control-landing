name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - bot/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # PUBLIC_-переменные Vite/Astro инлайнит в клиентский JS на этапе сборки.
      # См. README.md → "Отправка заявок с формы" — почему токен осознанно
      # оказывается в открытом виде на странице.
      - name: Build
        env:
          PUBLIC_GITHUB_DISPATCH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
          # Необязательные переменные (Settings → Secrets and variables → Actions → Variables).
          # Не заданы — используются значения по умолчанию (см. astro.config.mjs, Layout.astro).
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
          PUBLIC_YM_ID: ${{ vars.PUBLIC_YM_ID }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_YANDEX_VERIFICATION: ${{ vars.PUBLIC_YANDEX_VERIFICATION }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Сборка под боевой домен и публикация готового сайта в ветку production.
  # Plesk забирает эту ветку в httpdocs (Git → Pull updates), см. README → "Хостинг (Plesk)".
  publish-production:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build for production domain
        env:
          PUBLIC_GITHUB_DISPATCH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
          SITE_URL: ${{ vars.PRODUCTION_SITE_URL || 'https://qazpestcontrol.com' }}
          SITE_BASE: /
          PUBLIC_YM_ID: ${{ vars.PUBLIC_YM_ID }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_YANDEX_VERIFICATION: ${{ vars.PUBLIC_YANDEX_VERIFICATION }}
        run: npm run build

      - name: Publish dist to production branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/publish-production.sh dist \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            production "deploy: ${GITHUB_SHA::7}"

  notify:
    needs: [build, deploy, publish-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Telegram
        env:
          BOT_TOKEN:     ${{ secrets.PIPLINE_BOT_SECRET }}
          CHAT_ID:       ${{ secrets.CHAT_ID }}
          BUILD_STATUS:  ${{ needs.build.result }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          PRODUCTION_STATUS: ${{ needs.publish-production.result }}
          SITE_URL:      ${{ needs.deploy.outputs.page_url }}
          ACTOR:         ${{ github.actor }}
          BRANCH:        ${{ github.ref_name }}
          SHA:           ${{ github.sha }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "No telegram secrets, skipping notification"
            exit 0
          fi

          SHORT_SHA="${SHA:0:7}"

          if [ "$PRODUCTION_STATUS" != "success" ]; then
            PROD_LINE="%0A⚠️ Ветка production (qazpestcontrol.com) не обновлена: ${PRODUCTION_STATUS}"
          else
            PROD_LINE="%0A🌍 Ветка production обновлена — забрать в Plesk (Pull updates)"
          fi

          if [ "$BUILD_STATUS" = "success" ] && [ "$DEPLOY_STATUS" = "success" ]; then
            TEXT="@${ACTOR}%0A✅ Deployed successfully!%0ABranch: ${BRANCH}%0ACommit: ${SHORT_SHA}%0A🌐 ${SITE_URL}${PROD_LINE}"
          elif [ "$BUILD_STATUS" != "success" ]; then
            TEXT="@${ACTOR}%0A❌ Build failed!%0ABranch: ${BRANCH}%0ACommit: ${SHORT_SHA}"
          else
            TEXT="@${ACTOR}%0A❌ Deploy failed!%0ABranch: ${BRANCH}%0ACommit: ${SHORT_SHA}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="$TEXT"
