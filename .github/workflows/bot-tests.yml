name: Bot tests

on:
  push:
    paths: ["public/bot/**", "tests/bot/**", ".github/workflows/bot-tests.yml"]
  pull_request:
    paths: ["public/bot/**", "tests/bot/**"]

permissions:
  contents: read

jobs:
  phptest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, mbstring

      # Тесты не ходят в сеть и не требуют токенов — только логика диалога и тексты.
      - run: php tests/bot/run.php

      - name: Syntax check
        run: |
          for f in public/bot/*.php public/bot/lib/*.php public/admin/*.php public/admin/lib/*.php public/api/*.php; do
            php -l "$f" >/dev/null || exit 1
          done
